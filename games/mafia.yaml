name: mafia
teams: [mafia, town]

roles:
  mafia:
    team: mafia
    count: 2
    sees: [own_role, teammates]
    actions: [kill]
  detective:
    team: town
    count: 1
    sees: [own_role, investigate_results]
    actions: [investigate]
  doctor:
    team: town
    count: 1
    sees: [own_role]
    actions: [protect]
  villager:
    team: town
    count: remainder
    sees: [own_role]
    actions: []

phases:
  - name: night
    order: simultaneous
    actors: all
    legal_actions: [use_ability, whisper]
    resolution: [protect, kill, investigate]
  - name: day
    order: sequential
    actors: all
    legal_actions: [speak, vote]
    repeats_until: win_conditions_checked

win_conditions:
  - team: mafia
    when: "alive(mafia) >= alive(town)"
  - team: town
    when: "alive(mafia) == 0"
